<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fire Hand VFX</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #000;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    #camera {
        position: fixed;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        transform: scaleX(-1);
    }

    #vfx {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
    }

    #start {
        position: fixed;
        z-index: 10;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);

        padding: 16px 30px;
        border: 0;
        border-radius: 30px;

        background: white;
        color: black;

        font-size: 18px;
        font-weight: bold;

        cursor: pointer;
    }

    #info {
        position: fixed;
        z-index: 5;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);

        color: white;
        font-size: 18px;
        font-weight: bold;

        text-shadow:
            0 0 10px #fff,
            0 0 20px #fff;

        pointer-events: none;
    }
</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>

<canvas id="vfx"></canvas>

<button id="start">
    START CAMERA
</button>

<div id="info">
    🔥 FIRE HAND VFX
</div>


<script type="module">

import {
    HandLandmarker,
    FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";


const video = document.getElementById("camera");
const canvas = document.getElementById("vfx");
const ctx = canvas.getContext("2d");

const startButton = document.getElementById("start");

let handLandmarker;

let particles = [];

let lastVideoTime = -1;

let width;
let height;


/* =========================================================
   CANVAS
========================================================= */

function resizeCanvas() {

    width = window.innerWidth;
    height = window.innerHeight;

    const dpr = Math.min(
        window.devicePixelRatio || 1,
        1.5
    );

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =========================================================
   MEDIAPIPE
========================================================= */

async function setupMediaPipe() {

    const vision =
        await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
        );

    handLandmarker =
        await HandLandmarker.createFromOptions(
            vision,
            {
                baseOptions: {
                    modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

                    delegate: "GPU"
                },

                runningMode: "VIDEO",

                numHands: 2,

                minHandDetectionConfidence: 0.5,

                minHandPresenceConfidence: 0.5,

                minTrackingConfidence: 0.5
            }
        );
}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    },

                    frameRate: {
                        ideal: 60,
                        max: 60
                    }
                },

                audio: false
            });

        video.srcObject = stream;

        await video.play();

        startButton.style.display = "none";

        await setupMediaPipe();

        requestAnimationFrame(loop);

    }

    catch (error) {

        console.error(error);

        alert(
            "Camera permission is required."
        );
    }
}


startButton.addEventListener(
    "click",
    startCamera
);


/* =========================================================
   DISTANCE
========================================================= */

function distance(a, b) {

    const dx = a.x - b.x;
    const dy = a.y - b.y;

    return Math.sqrt(
        dx * dx + dy * dy
    );
}


/* =========================================================
   HAND CENTER
========================================================= */

function getCenter(hand) {

    const wrist = hand[0];

    const middle =
        hand[9];

    return {

        x:
        (wrist.x + middle.x) / 2,

        y:
        (wrist.y + middle.y) / 2
    };
}


/* =========================================================
   CREATE PARTICLE
========================================================= */

function createParticle(
    x,
    y,
    color,
    power = 1
) {

    const angle =
        Math.random() *
        Math.PI * 2;

    const speed =
        (0.5 + Math.random() * 2.5)
        * power;

    particles.push({

        x,

        y,

        vx:
        Math.cos(angle) * speed,

        vy:
        (-1.5 - Math.random() * 3)
        * power,

        life:
        0.5 + Math.random() * 0.6,

        size:
        2 + Math.random() * 6,

        color
    });


    /* Prevent lag */

    if (particles.length > 900) {

        particles.splice(
            0,
            particles.length - 900
        );
    }
}


/* =========================================================
   FIRE
========================================================= */

function createFire(
    hand,
    color,
    intensity = 1
) {

    const points = [

        hand[0],

        hand[4],

        hand[8],

        hand[12],

        hand[16],

        hand[20],

        hand[5],

        hand[9],

        hand[13],

        hand[17]
    ];


    for (
        const p of points
    ) {

        const x =
            (1 - p.x) * width;

        const y =
            p.y * height;


        const amount =
            Math.floor(
                1 + Math.random() * 3
            );


        for (
            let i = 0;
            i < amount;
            i++
        ) {

            createParticle(

                x +
                (Math.random() - 0.5)
                * 30,

                y +
                (Math.random() - 0.5)
                * 20,

                color,

                intensity
            );
        }
    }
}


/* =========================================================
   PARTICLE RENDER
========================================================= */

function renderParticles() {

    ctx.save();

    ctx.globalCompositeOperation =
        "lighter";


    for (
        const p of particles
    ) {

        p.life -= 0.018;

        p.x += p.vx;

        p.y += p.vy;

        p.vy += 0.025;

        if (p.life <= 0) {
            continue;
        }


        const alpha =
            Math.min(
                1,
                p.life * 1.5
            );


        ctx.globalAlpha =
            alpha;


        ctx.shadowBlur =
            15;

        ctx.shadowColor =
            p.color;


        ctx.fillStyle =
            p.color;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size * p.life,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* Hot center */

        ctx.shadowBlur = 0;

        ctx.fillStyle =
            "rgba(255,255,255,0.9)";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            Math.max(
                1,
                p.size * 0.25
            ),
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    ctx.restore();


    particles =
        particles.filter(
            p => p.life > 0
        );
}


/* =========================================================
   PALM GLOW
========================================================= */

function palmGlow(
    center,
    color,
    power = 1
) {

    const x =
        (1 - center.x) * width;

    const y =
        center.y * height;


    const radius =
        45 * power;


    const gradient =
        ctx.createRadialGradient(
            x,
            y,
            0,
            x,
            y,
            radius
        );


    gradient.addColorStop(
        0,
        color
    );

    gradient.addColorStop(
        0.25,
        color
    );

    gradient.addColorStop(
        1,
        "transparent"
    );


    ctx.save();

    ctx.globalCompositeOperation =
        "lighter";

    ctx.globalAlpha =
        0.65;

    ctx.fillStyle =
        gradient;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();
}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(time) {

    if (
        video.readyState >= 2 &&
        handLandmarker
    ) {

        if (
            video.currentTime !==
            lastVideoTime
        ) {

            lastVideoTime =
                video.currentTime;


            const result =
                handLandmarker.detectForVideo(
                    video,
                    performance.now()
                );


            const hands =
                result.landmarks || [];


            /* =============================================
               CLEAR
            ============================================= */

            ctx.clearRect(
                0,
                0,
                width,
                height
            );


            /* =============================================
               TWO HANDS
            ============================================= */

            let together = false;


            if (
                hands.length === 2
            ) {

                const c1 =
                    getCenter(hands[0]);

                const c2 =
                    getCenter(hands[1]);


                const d =
                    distance(c1, c2);


                /*
                 * Adaptive threshold
                 */

                if (d < 0.28) {

                    together = true;
                }
            }


            /* =============================================
               FIRE COLORS
            ============================================= */

            const BLUE =
                "#0088ff";

            const RED =
                "#ff1744";

            const PURPLE =
                "#c020ff";


            /* =============================================
               DRAW HAND FIRE
            ============================================= */

            hands.forEach(
                (hand, index) => {

                    let color;


                    if (together) {

                        color =
                            PURPLE;

                    }
                    else {

                        color =
                            index === 0
                            ? BLUE
                            : RED;
                    }


                    const center =
                        getCenter(hand);


                    const power =
                        together
                        ? 1.8
                        : 1;


                    palmGlow(
                        center,
                        color,
                        power
                    );


                    createFire(
                        hand,
                        color,
                        power
                    );
                }
            );


            /* =============================================
               PURPLE CORE
            ============================================= */

            if (
                together &&
                hands.length === 2
            ) {

                const c1 =
                    getCenter(hands[0]);

                const c2 =
                    getCenter(hands[1]);


                const center = {

                    x:
                    (c1.x + c2.x) / 2,

                    y:
                    (c1.y + c2.y) / 2
                };


                palmGlow(
                    center,
                    PURPLE,
                    2.5
                );


                const x =
                    (1 - center.x)
                    * width;

                const y =
                    center.y
                    * height;


                for (
                    let i = 0;
                    i < 8;
                    i++
                ) {

                    createParticle(
                        x +
                        (Math.random() - 0.5)
                        * 50,

                        y +
                        (Math.random() - 0.5)
                        * 50,

                        PURPLE,
                        1.5
                    );
                }
            }
        }
    }


    /* =============================================
       PARTICLES
    ============================================= */

    renderParticles();


    requestAnimationFrame(
        loop
    );
}

</script>

</body>
</html>
